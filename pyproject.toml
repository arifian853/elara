[project]
name = "elara-public"
version = "0.1.0"
description = "Elara Public — RAG chatbot + intake assistant for Arifian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.43.67",
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

